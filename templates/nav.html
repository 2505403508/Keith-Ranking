<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}Keith Ranking{% endblock %}</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>

  <body>
    <nav class="navbar">
      <div class="navbar-container">
        <a href="/" class="navbar-logo"> Keith Ranking </a>

        <ul class="navbar-links">
          <li>
            <a href="/">Home</a>
          </li>

          <li>
            <a href="/all">Games</a>
          </li>

          <li>
            <a href="/pd">Companies</a>
          </li>

          <li>
            <a href="/ranking">Ranking</a>
          </li>
        </ul>

        <div class="navbar-account">
          {% if session.get("user_id") %}

          <span class="navbar-username"> {{ session.get("username") }} </span>

          <a href="/favourites" class="navbar-login"> Favourites </a>

          <a href="/logout" class="navbar-login"> Log Out </a>

          {% else %}

          <a href="/login" class="navbar-login"> Log In </a>

          <a href="/signup" class="navbar-signup"> Sign Up </a>

          {% endif %}
        </div>
      </div>
    </nav>

    <main class="page-content">{% block content %}{% endblock %}</main>
  </body>
</html>
