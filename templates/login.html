{% extends "nav.html" %} {% block title %} Log In | Keith Ranking {% endblock %}
{% block content %}

<section class="account-page">
  <div class="account-box">
    <p class="account-small-title">WELCOME BACK</p>

    <h1>Log In</h1>

    <p class="account-text">Log in to view and manage your favourites.</p>

    {% if error %}

    <p class="account-error">{{ error }}</p>

    {% endif %}

    <form class="account-form" method="post">
      <label for="login_value">Username or Email</label>

      <input
        type="text"
        id="login_value"
        name="login_value"
        maxlength="100"
        value="{{ request.form.get('login_value', '') }}"
        required
      />

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        name="password"
        maxlength="128"
        required
      />

      <button type="submit">Log In</button>
    </form>

    <p class="account-switch">
      Do not have an account?
      <a href="/signup">Sign Up</a>
    </p>
  </div>
</section>

{% endblock %}
