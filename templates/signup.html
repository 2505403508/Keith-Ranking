{% extends "nav.html" %} {% block title %} Sign Up | Keith Ranking {% endblock
%} {% block content %}

<section class="account-page">
  <div class="account-box">
    <p class="account-small-title">CREATE ACCOUNT</p>

    <h1>Sign Up</h1>

    <p class="account-text">
      Create an account to save your favourite games and companies.
    </p>

    {% if error %}

    <p class="account-error">{{ error }}</p>

    {% endif %}

    <form class="account-form" method="post">
      <label for="username">Username</label>

      <input
        type="text"
        id="username"
        name="username"
        minlength="3"
        maxlength="20"
        pattern="[A-Za-z0-9_]+"
        title="Use letters, numbers and underscores only."
        value="{{ request.form.get('username', '') }}"
        required
      />

      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        name="email"
        maxlength="100"
        value="{{ request.form.get('email', '') }}"
        required
      />

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        name="password"
        minlength="8"
        maxlength="128"
        required
      />

      <label for="confirm_password">Confirm Password</label>

      <input
        type="password"
        id="confirm_password"
        name="confirm_password"
        minlength="8"
        maxlength="128"
        required
      />

      <button type="submit">Create Account</button>
    </form>

    <p class="account-switch">
      Already have an account?
      <a href="/login">Log In</a>
    </p>
  </div>
</section>

{% endblock %}
